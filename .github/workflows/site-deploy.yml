name: Deploy site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy site files (one scp per file)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -eo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          HOST="$DEPLOY_USER@$DEPLOY_HOST"
          DEST="$HOST:/site/"
          sftp -b - -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$HOST" <<< $'mkdir /site/assets' || true
          sftp -b - -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$HOST" <<< $'mkdir /site/assets/fonts' || true
          # Retired assets. scp only ever adds, so without this a file dropped
          # from the repo keeps being served forever; bb-logo.png was still
          # public after the rebrand for exactly that reason.
          sftp -b - -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$HOST" <<< $'rm /site/assets/bb-logo.png' || true

          # scp one file per command. Passing two source paths to a single scp
          # flattens directory structure (recorded trap) — never combine paths.
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new index.html "$DEST"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new get-started.html "$DEST"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new licensing.html "$DEST"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new pricing.html "$DEST"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new enterprise.html "$DEST"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new contributing.html "$DEST"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new security.html "$DEST"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new community.html "$DEST"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new 404.html "$DEST"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new robots.txt "$DEST"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new sitemap.xml "$DEST"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new assets/mark.svg "$HOST:/site/assets/"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new assets/mark-reverse.svg "$HOST:/site/assets/"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new assets/favicon.svg "$HOST:/site/assets/"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new assets/favicon.ico "$HOST:/site/assets/"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new assets/favicon-16.png "$HOST:/site/assets/"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new assets/favicon-32.png "$HOST:/site/assets/"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new assets/favicon-48.png "$HOST:/site/assets/"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new assets/apple-touch-icon.png "$HOST:/site/assets/"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new assets/philotas-og.png "$HOST:/site/assets/"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new assets/fonts.css "$HOST:/site/assets/"
          # The self-hosted faces are separate files, so each is its own scp for
          # the same reason as the flat files above.
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new assets/fonts/ibm-plex-sans-latin-var.woff2 "$HOST:/site/assets/fonts/"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new assets/fonts/ibm-plex-mono-latin-400.woff2 "$HOST:/site/assets/fonts/"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new assets/fonts/ibm-plex-mono-latin-500.woff2 "$HOST:/site/assets/fonts/"

      - name: Verify site is live and report Last-Modified
        run: |
          set -eo pipefail
          curl -sf -D - https://philotas.com/ -o /dev/null | grep -i '^last-modified:' || echo "Last-Modified: (header absent)"
